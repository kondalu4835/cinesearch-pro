<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="CineSearch — The Ultimate Movie Discovery Platform" />
    <meta property="og:title" content="CineSearch" />
    <meta property="og:description" content="Find any movie, actor, or show instantly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>CineSearch</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #080808; color: #e8e8e8; font-family: 'Inter', sans-serif; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0f0f0f; }
      ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 2px; }
      ::selection { background: rgba(245,158,11,0.3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
